[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url 은 alembic/env.py가 DATABASE_URL 환경변수에서 읽는다(비밀 값을 파일에 쓰지 않는다)

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
